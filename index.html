<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Oxxila</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('oxxila-theme');
          if (theme !== 'dark' && theme !== 'light') theme = 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <script>
      (function () {
        try {
          var hash = location.hash;
          if (!hash) return;
          var match = hash.slice(1).match(/(?:^|&)(?:accessToken|access_token|token|jwt)=([^&]+)/);
          if (!match) return;
          var token = decodeURIComponent(match[1]);
          localStorage.setItem('oxxila_access_token', token);
          try {
            var segment = token.split('.')[1];
            if (segment) {
              var payload = JSON.parse(
                atob(segment.replace(/-/g, '+').replace(/_/g, '/')),
              );
              localStorage.setItem(
                'oxxila_user',
                JSON.stringify({
                  id: String(payload.userId || payload.id || payload.sub || ''),
                  name: String(payload.name || payload.username || 'User'),
                  email: String(payload.email || ''),
                  role: String(payload.role || 'user'),
                }),
              );
            }
          } catch (e) {}
          history.replaceState({}, document.title, '/home');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
