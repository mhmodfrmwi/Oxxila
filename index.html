<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oxxila</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('oxxila-theme');
          if (theme !== 'dark' && theme !== 'light') theme = 'light';
          document.documentElement.dataset.theme = theme;
          // Arabic (rtl) is the default; only a saved English choice flips it before paint.
          if (localStorage.getItem('oxxila-language') === 'en') {
            document.documentElement.lang = 'en';
            document.documentElement.dir = 'ltr';
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <script>
      (function () {
        try {
          var hash = location.hash;
          if (!hash) return;
          var match = hash.slice(1).match(/(?:^|&)(?:accessToken|access_token|token|jwt)=([^&]+)/);
          if (!match) return;
          var token = decodeURIComponent(match[1]);
          localStorage.setItem('oxxila_access_token', token);
          try {
            var segment = token.split('.')[1];
            if (segment) {
              var payload = JSON.parse(
                atob(segment.replace(/-/g, '+').replace(/_/g, '/')),
              );
              localStorage.setItem(
                'oxxila_user',
                JSON.stringify({
                  id: String(payload.userId || payload.id || payload.sub || ''),
                  name: String(payload.name || payload.username || 'User'),
                  email: String(payload.email || ''),
                  role: String(payload.role || 'user'),
                }),
              );
            }
          } catch (e) {}
          history.replaceState({}, document.title, '/home');
        } catch (e) {}
      })();
    </script>
    <style>
      /* First-paint splash; React replaces #root's content on mount. */
      .boot-splash { min-height: 100dvh; display: grid; place-items: center; background: #f5f6ff; }
      [data-theme='dark'] .boot-splash { background: #1e2229; }
      .boot-splash-mark { position: relative; width: 72px; height: 72px; display: grid; place-items: center; }
      .boot-splash-mark::before { content: ''; position: absolute; inset: 0; border-radius: 9999px;
        background: conic-gradient(from 0deg, transparent, rgb(123 101 251 / .15) 120deg, #7b65fb 320deg, transparent);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
        animation: boot-spin 1.1s linear infinite; }
      .boot-splash-mark img { width: 33px; height: 33px; animation: boot-breathe 1.6s ease-in-out infinite; }
      @media (min-width: 640px) { .boot-splash-mark { width: 96px; height: 96px; } .boot-splash-mark img { width: 44px; height: 44px; } }
      @media (min-width: 1024px) { .boot-splash-mark { width: 112px; height: 112px; } .boot-splash-mark img { width: 52px; height: 52px; } }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-breathe { 0%,100% { transform: scale(.92); opacity: .75; } 50% { transform: scale(1.06); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot-splash-mark::before, .boot-splash-mark img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-label="Oxxila">
        <div class="boot-splash-mark"><img src="/favicon.svg" alt="" /></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
